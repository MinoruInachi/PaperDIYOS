; PaperDIY OS — M5Stack PaperDIY 向けの Badger OS 風環境
;
; ボードは M5Stack PaperDIY（ESP32-S3 / 16MB flash / 8MB octal PSRAM /
; ED047TC1 960x540 16 階調 / KEY1=G4, KEY2=G3 / M5PM1 / SPI microSD）。
; ライブラリは FreeInk SDK をシンボリックリンクで参照する。
;   tools/setup_sdk.sh          FreeInk SDK（サブモジュール）に差分を当てる
;   tools/setup_micropython.sh  MicroPython（サブモジュール）から lib/micropython/embed を作る

[env:paperdiy]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB
; M5GFX の Panel_EPD は octal PSRAM を前提にしている
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600
; src/reader と src/apps と src/os をまとめてビルドする
build_src_filter = +<*> +<reader/*> +<apps/*> +<os/*> +<python/*>
; python/lib と python/examples をファームウェアへ埋め込む
extra_scripts = pre:tools/embed_py.py

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++2a
  ; FreeInkBook と M5GFX は同じ miniz を別々に持っている。miniz の
  ; "\03\03\013"[dist - 16] は「文字列 - 16」という再配置になるので、リンカが
  ; 2 つの文字列を統合すると指す先がずれ、ZIP の展開が壊れる（EPUB が開けなくなる）。
  -fno-merge-constants
  -I include
  -I src
  -I src/reader
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_PAPERDIY=1
  ; 8MB PSRAM があるので FreeInkBook は大きいほうの見積りで組む
  -DFREEINK_BOOK_LARGE=1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardPaperDiy=symlink://freeink-sdk/libs/hardware/BoardPaperDiy
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  FreeInkBook=symlink://freeink-sdk/libs/book/FreeInkBook
  m5stack/M5GFX @ 0.2.36
  ; ファイル転送の送信側。HTTP サーバは Arduino コアの WebServer を使う。
  links2004/WebSockets @ 2.7.3
